<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROVIDENTIA - Poslovanje &amp; Eventi</title>
    <meta name="description" content="Stranica je u izradi. Za sve upite kontaktirajte nas na info@providentia-poslovanje-eventi.hr.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#3B4A66">
    <link rel="icon" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cantata+One&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cantata One', Georgia, serif;
            background: #F6F1E7;
            color: #3B4A66;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .wrap { max-width: 560px; }
        .logo { max-width: 280px; width: 70%; height: auto; margin-bottom: 36px; }
        .rule {
            width: 64px; height: 2px; margin: 0 auto 28px;
            background: linear-gradient(100deg, #8A6A1C, #E6C25E, #B5882A);
        }
        h1 { font-weight: 400; font-size: clamp(26px, 5vw, 34px); margin-bottom: 14px; }
        .en { color: #5A6373; font-size: 15px; margin-bottom: 34px; }
        .lead { font-size: 16.5px; line-height: 1.7; color: #41506B; margin-bottom: 8px; }
        .contact { margin-top: 26px; display: grid; gap: 10px; }
        .contact a {
            color: #3B4A66; text-decoration: none; font-size: 16px;
            border: 1px solid rgba(191, 149, 48, 0.45);
            border-radius: 4px; padding: 12px 18px; display: block;
            transition: background 0.2s ease;
        }
        .contact a:hover { background: #EFE8DA; }
        .contact .icon { color: #BF9530; margin-right: 8px; }
        .foot { margin-top: 40px; font-size: 13px; color: #6A7280; }
    </style>
</head>
<body>
    <div class="wrap">
        <img src="images/logo-full.png" alt="Providentia — Poslovanje &amp; Eventi" class="logo">
        <div class="rule"></div>
        <h1>Stranica je u izradi</h1>
        <p class="en">Our website is currently under construction.</p>
        <p class="lead">Uskoro se vraćamo u novom izdanju. U međuvremenu, za sve upite i ponude slobodno nam se javite — tu smo za vas.</p>
        <div class="contact">
            <a href="mailto:info@providentia-poslovanje-eventi.hr"><span class="icon">✉</span>info@providentia-poslovanje-eventi.hr</a>
            <a href="tel:+385996359829"><span class="icon">☎</span>099 635 9829</a>
        </div>
        <p class="foot">© 2026 Providentia. Sva prava pridržana.</p>
    </div>
</body>
</html>
